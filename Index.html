<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Annu AI</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080b12;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #202532;
  background:#0d111a;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.status{
  color:#35e07d;
  font-size:14px;
}

#chat{
  height:calc(100vh - 135px);
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.welcome{
  text-align:center;
  margin:auto;
  color:#b9c0cc;
}

.welcome h1{
  color:white;
  margin-bottom:12px;
}

.welcome p{
  margin:5px;
}

.msg{
  max-width:82%;
  padding:13px 16px;
  border-radius:16px;
  white-space:pre-wrap;
  line-height:1.5;
  font-size:15px;
}

.user{
  align-self:flex-end;
  background:#2563eb;
  border-bottom-right-radius:5px;
}

.ai{
  align-self:flex-start;
  background:#171c27;
  border:1px solid #252c39;
  border-bottom-left-radius:5px;
}

.bottom{
  height:70px;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  gap:8px;
  padding:10px;
  background:#0d111a;
  border-top:1px solid #202532;
}

.bottom input{
  flex:1;
  border:none;
  outline:none;
  background:#171c27;
  color:white;
  padding:0 15px;
  border-radius:14px;
  font-size:16px;
}

.bottom button{
  width:50px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.bottom button:active{
  transform:scale(.95);
}

</style>
</head>

<body>

<header>

  <div class="logo">
    🤖 Annu AI
  </div>

  <div class="status">
    • Online
  </div>

</header>


<div id="chat">

  <div class="welcome" id="welcome">

    <h1>Namaste 👋</h1>

    <p>Main Annu AI hoon 🤖</p>

    <p>Aap mujhse kuch bhi pooch sakte ho.</p>

  </div>

</div>


<div class="bottom">

  <button onclick="voice()">🎤</button>

  <input
    id="input"
    placeholder="Annu AI se poocho..."
    onkeydown="if(event.key==='Enter')send()"
  >

  <button onclick="send()">➤</button>

</div>


<script>

/* =========================
   OPENAI API KEY
   ========================= */

const API_KEY = "PASTE_YOUR_OPENAI_API_KEY_HERE";


/* =========================
   ELEMENTS
   ========================= */

const input =
  document.getElementById("input");

const chat =
  document.getElementById("chat");

const welcome =
  document.getElementById("welcome");


/* =========================
   ADD MESSAGE
   ========================= */

function add(text,type){

  const div =
    document.createElement("div");

  div.className =
    "msg " + type;

  div.innerText =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   REAL AI
   ========================= */

async function getAIAnswer(message){

  try{

    const response =
      await fetch(
        "https://api.openai.com/v1/responses",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + API_KEY
          },

          body:JSON.stringify({

            model:"gpt-5.6-luna",

            instructions:
            "You are Annu AI, a friendly Hindi and Hinglish AI assistant. Answer naturally, clearly and helpfully. Reply in the same language as the user. Keep answers useful and easy to understand.",

            input:message

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      console.log(data);

      throw new Error(
        data.error?.message ||
        "OpenAI error"
      );

    }


    return data.output_text ||
      "Mujhe answer nahi mila 😔";


  }catch(error){

    console.error(error);

    return(
      "Sorry 😔 AI se connection nahi ho pa raha.\n\n"+
      "API key aur internet connection check karo."
    );

  }

}


/* =========================
   SEND MESSAGE
   ========================= */

async function send(){

  const text =
    input.value.trim();

  if(!text)return;


  welcome.style.display =
    "none";


  add(
    text,
    "user"
  );


  input.value="";


  add(
    "Soch rahi hoon... 🤔",
    "ai"
  );


  const answer =
    await getAIAnswer(text);


  const aiMessages =
    chat.querySelectorAll(".msg.ai");


  if(aiMessages.length){

    aiMessages[
      aiMessages.length - 1
    ].remove();

  }


  add(
    answer,
    "ai"
  );


  speak(answer);

}


/* =========================
   VOICE INPUT
   ========================= */

function voice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Voice feature is browser mein supported nahi hai."
    );

    return;
  }


  const r =
    new SpeechRecognition();


  r.lang =
    "hi-IN";


  r.continuous =
    false;


  r.interimResults =
    false;


  r.start();


  r.onresult =
    function(event){

      input.value =
        event.results[0][0].transcript;

      send();

    };


  r.onerror =
    function(){

      alert(
        "Voice input mein problem aa gayi."
      );

    };

}


/* =========================
   VOICE OUTPUT
   ========================= */

function speak(text){

  if(!window.speechSynthesis)
    return;


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.lang =
    "hi-IN";


  speech.rate =
    0.9;


  speech.pitch =
    1;


  speechSynthesis.cancel();


  speechSynthesis.speak(
    speech
  );

}

</script>

</body>
      </html>
